services:
  - type: web
    name: graspiq-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SAMBA_API_KEY
        sync: false  # You'll add manually in Render dashboard
      - key: FLASK_SECRET_KEY
        sync: false  # You'll add manually in Render dashboard
      - key: DEBUG
        value: True
      - key: PORT
        value: 5000
      - key: PYTHON_VERSION
        value: 3.9.0
