services:
  - type: web
    name: doc-assistant
    runtime: python
    repo: https://github.com/Avistriker/Doc-Assistant
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ENABLE_AI_MODE
        value: true
      - key: DEFAULT_CHAT_MODE
        value: no_ai
      - key: MAX_CONTENT_LENGTH_MB
        value: 16
      - key: CHAT_HISTORY_LIMIT
        value: 100
      - key: FLASK_DEBUG
        value: false
